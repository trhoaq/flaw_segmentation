[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railflaw-segmentation"
version = "0.1.0"
description = "Rail surface mask normalization and YOLO26 instance segmentation training"
requires-python = ">=3.11"
dependencies = [
  "ultralytics==8.4.214",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
  "Pillow>=10",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
